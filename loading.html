<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acord</title>
<style>
html,body{height:100%;margin:0;background:#07110e;color:#eff8f3;font-family:Arial,sans-serif}
main{height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{width:min(520px,100%);padding:32px;border:1px solid #24473b;border-radius:20px;background:#0d1b17;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.32)}
.logo{width:64px;height:64px;margin:0 auto 16px;border-radius:18px;background:#153d31;display:grid;place-items:center;color:#52e0a8;font-size:34px;font-weight:900}
h1{margin:0 0 10px;font-size:24px}p{color:#a8beb4;line-height:1.5;margin:0}.bar{height:5px;background:#13271f;border-radius:999px;margin-top:22px;overflow:hidden}.bar:after{content:"";display:block;width:36%;height:100%;background:#41d99a;border-radius:inherit;animation:move 1.2s ease-in-out infinite alternate}@keyframes move{from{transform:translateX(-20%)}to{transform:translateX(210%)}}
</style>
</head>
<body><main><div class="card"><div class="logo">A</div><h1>Abrindo o Acord</h1><p>Conectando e validando a interface com segurança…</p><div class="bar"></div></div></main></body>
</html>
