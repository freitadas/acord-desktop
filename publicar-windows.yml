name: Publicar Acord para Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: acord-windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Testar inicialização
        run: npm test

      - name: Gerar instalador
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Validar artefatos
        shell: pwsh
        run: |
          if (!(Test-Path "dist/Acord-Setup.exe")) {
            throw "Acord-Setup.exe não foi gerado."
          }
          if (!(Test-Path "dist/latest.yml")) {
            throw "latest.yml não foi gerado; a atualização automática ficaria incompleta."
          }
          Get-ChildItem dist

      - name: Publicar sem apagar release válida
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          FILES=(dist/Acord-Setup.exe dist/latest.yml)
          while IFS= read -r -d '' file; do FILES+=("$file"); done < <(find dist -maxdepth 1 -type f -name '*.blockmap' -print0)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --title "Acord ${TAG}" --generate-notes
          fi
