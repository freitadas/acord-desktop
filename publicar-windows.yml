name: Publicar Acord para Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Limpar release da mesma versão em reexecução
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release delete "v${VERSION}" --yes --cleanup-tag || true

      - name: Gerar e publicar instalador
        run: npm run release
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Confirmar instalador e atualização automática
        shell: pwsh
        run: |
          if (!(Test-Path "dist/Acord-Setup.exe")) {
            throw "Acord-Setup.exe não foi gerado."
          }
          if (!(Test-Path "dist/latest.yml")) {
            throw "latest.yml não foi gerado."
          }
          Get-ChildItem dist
